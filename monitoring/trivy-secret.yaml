# Reviewed false positive: google-auth 2.62.1.
# The source contains PKCS1/PKCS8 format delimiters, not embedded private keys.
# Trivy 0.56.2 matches those delimiters in the compiled Python file.
# Reassess this exception when google-auth or Python changes.
# References:
# https://github.com/aquasecurity/trivy/discussions/7695
# https://googleapis.dev/python/google-auth/latest/_modules/google/auth/crypt/_python_rsa.html

allow-rules:
  - id: google-auth-pyc-pem-delimiters
    description: Verified PEM format delimiters in google-auth compiled module
    path: '^/?app/\.venv/lib/python3\.11/site-packages/google/auth/crypt/__pycache__/_python_rsa\.cpython-311\.pyc$'
